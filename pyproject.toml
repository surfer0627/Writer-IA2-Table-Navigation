[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writer-ia2-table-navigation"
dynamic = ["version"]
description = "Experimental NVDA add-on for IA2 table navigation in LibreOffice Writer"
maintainers = [
	{name = "Victor Tsai", email = "surfer0627@gmail.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.TXT"}
dependencies = [
	# Build add-on
	"scons==4.10.1",
	"Markdown==3.10",
	# Translations management
	"nh3==0.3.2",
	"crowdin-api-client==1.24.1",
	"lxml==6.1.0",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
	# Lint
	"uv==0.11.15",
	"ruff==0.14.5",
	"pre-commit==4.2.0",
	"pyright[nodejs]==1.1.407",
]
[project.urls]
Repository = "https://github.com/surfer0627/Writer-IA2-Table-Navigation"
Issues = "https://github.com/surfer0627/Writer-IA2-Table-Navigation/issues"

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"buildVars.py",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# sconscripts contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

[tool.pyright]
venvPath = ".venv"
venv = "."
pythonPlatform = "Windows"
typeCheckingMode = "basic"
stubPath = ".vscode/typings"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	".venv",
	"site_scons",
	".github/scripts",
	# These modules depend on runtime-created NVDA and IA2 members. Keep the
	# exclusions explicit until typed protocols are introduced for them.
	"addon/appModules/soffice.py",
	"addon/appModules/writerIA2TableCommands.py",
	"addon/appModules/writerIA2TableContentProvider.py",
	"addon/appModules/writerIA2TableFields.py",
	"addon/appModules/writerIA2TableSayAll.py",
	"addon/appModules/writerIA2TableTextInfoPatch.py",
	"addon/appModules/writerTableNavCore.py",
]

extraPaths = [
	"./addon",
	"../nvda/source",
]

# GitHub Actions checks out only this add-on, not NVDA itself.
reportMissingImports = false
reportMissingModuleSource = false
analyzeUnannotatedFunctions = true
